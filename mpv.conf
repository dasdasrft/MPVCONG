hwdec=auto-safe
vo=gpu-next
gpu-api=d3d11
d3d11-flip=yes
video-sync=display-resample
interpolation=no
scale=nearest
cscale=bilinear

slang=zh-hans,zh-cn,chs,zh-hant,zh-tw,cht,zh
sub-auto=fuzzy

audio-file-auto=fuzzy
directory-mode=recursive
directory-filter-types=video
autocreate-playlist=filter

save-position-on-quit
watch-later-options=start,vid,aid,sid,sub-delay,volume,mute

title-bar=no
snap-window
no-osd-bar

script-opts=osc-deadzonesize=1
script-opts-add=console-font_size=12
script-opts-add=stats-font_size=12

input-builtin-bindings=no
input-default-bindings=no
input-doubleclick-time=200

cache=yes
demuxer-max-bytes=1073741824
demuxer-max-back-bytes=536870912
idle=yes
