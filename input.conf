### ====================== 不映射菜单 ======================
 MBTN_LEFT_DBL     cycle fullscreen    
 MBTN_LEFT         ignore             
 MBTN_BACK         playlist-next 
 MBTN_FORWARD      playlist-prev #@click
 MBTN_MID no-osd   cycle pause   
 MBTN_RIGHT        script-binding select/menu 
 MBTN_LEFT         ignore
 WHEEL_UP          ignore
 WHEEL_DOWN        ignore
 MBTN_FORWARD      script-binding  speedup                       #@press
 MBTN_FORWARD      script-binding slowdown                       #@release
 SPACE             cycle pause                                   #@click   
 SPACE             script-message-to evafast speedup             #@press
 SPACE             script-message-to evafast slowdown            #@release
 RIGHT             seek 5                                        #@click                               
 RIGHT             script-message-to evafast speedup             #@press
 RIGHT             script-message-to evafast slowdown            #@release
 ESC               set fullscreen no  
 ENTER             set fullscreen yes 
 Alt+ENTER         cycle fullscreen     
 LEFT              seek -5 
 PGUP              add volume 1
 PGDWN             add volume -1 
 INS               async screenshot video
 y                 script-binding select/select-sid
 t                 script-binding select/select-aid
 `                 script-binding console/enable        
 Tab               script-binding display-stats-toggle  
 c                 script-binding slicing_copy/slicing_mark
 C                 script-binding slicing_copy/clear_slicing_mark                              
 q                 quit                  
 Q                 quit
 d                 cycle deband
 D                 cycle deband
 z                 cycle tone-mapping
 x                 cycle gamut-mapping-mode
 a                 cycle target-colorspace-hint
 s                 cycle target-colorspace-hint-mode
 m                 add sub-delay -0.1;show-text "字幕延迟:${sub-delay}"          
 n                 add sub-delay  0.1;show-text "字幕预载:${sub-delay}"        
 b                 set sub-delay 0
 v                 cycle-values saturation -20 0 20
 i                 loadfile https://live.zbds.top/tv/iptv4.m3u
 CTRL+f            script-message-to sub_assrt sub-assrt     