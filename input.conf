MBTN_LEFT        ignore
MBTN_LEFT_DBL    cycle fullscreen
MBTN_MID         no-osd cycle pause
MBTN_RIGHT       context-menu
WHEEL_UP         add volume 2
WHEEL_DOWN       add volume -2
MBTN_BACK        playlist-prev
MBTN_FORWARD     playlist-next

SPACE            cycle pause
RIGHT            seek 5
LEFT             seek -5
Shift+RIGHT      seek 1 exact
Shift+LEFT       seek -1 exact
\                cycle-values speed 2.5 1.0; show-text "播放速度: ${speed}"
BS               set speed 1.0; show-text "恢复原速: 1.0x"

m                cycle mute
Alt+u            set sub-font "Segoe UI, Microsoft YaHei UI, sans-serif"; set sub-font-size 34; set sub-bold no; set sub-color "#FFFFFF"; set sub-border-style background-box; set sub-back-color "#BF000000"; set sub-border-size 3.2; set sub-shadow-offset 0; set sub-gauss 0; set sub-pos 100; set sub-margin-y 12; show-text "字幕样式: YouTube 默认 (贴底)"
y                cycle-values sub-filter-regex "s/^/{\\\\fad(200\\,100)}/" ""; show-text "平滑淡入动效开关"
ENTER            cycle fullscreen
Alt+ENTER        cycle fullscreen
ESC              set fullscreen no
Tab              script-binding display-stats-toggle
`                script-binding console/enable

c                script-message slicing-mark
C                script-message slicing-clear
Ctrl+b           script-message burn-current-sub
Ctrl+e           script-message extract-audio

q                quit
Q                quit-watch-later
