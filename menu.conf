播放 / 暂停	cycle pause	checked=pause
停止播放	stop
重载文件	set file-local-options/start ${=time-pos}; playlist-play-index current yes; show-text '正在重新载入当前文件...'

----------------------------------------

字幕
	主字幕轨	$sub-tracks
	次字幕轨	$secondary-sub-tracks
	显示字幕	cycle sub-visibility	checked=sub_visibility
	覆盖ASS特效	cycle sub-ass-override
	----------------------------------------
	平滑淡入动效 (y)	cycle-values sub-filter-regex "s/^/{\\\\fad(200\\,100)}/" ""; show-text "平滑淡入动效开关"
	----------------------------------------
	样式风格
		YouTube 默认	set sub-font "Segoe UI, Microsoft YaHei UI, sans-serif"; set sub-font-size 34; set sub-bold no; set sub-color "#FFFFFF"; set sub-border-style background-box; set sub-back-color "#BF000000"; set sub-border-size 3.2; set sub-shadow-offset 0; set sub-gauss 0; set sub-pos 100; set sub-margin-y 12; show-text "字幕样式: YouTube 默认 (贴底)"
		----------------------------------------
		护眼柔白 (1)	set sub-font "Microsoft YaHei UI"; set sub-font-size 36; set sub-bold yes; set sub-color "#EAEAEA"; set sub-border-color "#000000"; set sub-border-size 1.8; set sub-border-style outline-and-shadow; set sub-shadow-color "#A0000000"; set sub-shadow-offset 1.2; set sub-back-color "0.0/0.0/0.0/0.0"; show-text "字幕样式: 护眼柔白"
		暖调琥珀 (2)	set sub-font "Microsoft YaHei UI"; set sub-font-size 36; set sub-bold yes; set sub-color "#FFA500"; set sub-border-color "#000000"; set sub-border-size 1.8; set sub-border-style outline-and-shadow; set sub-shadow-color "#B0000000"; set sub-shadow-offset 1.0; set sub-back-color "0.0/0.0/0.0/0.0"; show-text "字幕样式: 暖调琥珀"
		番剧印刷 (3)	set sub-font "SimSun"; set sub-font-size 36; set sub-bold yes; set sub-color "#FAFAFA"; set sub-border-color "#1E222A"; set sub-border-size 2.0; set sub-border-style outline-and-shadow; set sub-shadow-color "#800F1115"; set sub-shadow-offset 1.4; set sub-back-color "0.0/0.0/0.0/0.0"; show-text "字幕样式: 番剧印刷"
	----------------------------------------
	字体放大 (+10%)	add sub-scale 0.1
	字体缩小 (-10%)	add sub-scale -0.1
	字体大小重置	set sub-scale 1.0
	----------------------------------------
	字幕提前 0.1s	add sub-delay -0.1
	字幕延后 0.1s	add sub-delay 0.1
	字幕延迟归零	set sub-delay 0
	----------------------------------------
	字幕上移	add sub-pos -1
	字幕下移	add sub-pos +1
	贴底复位	set sub-pos 100

音频
	选择音轨	$audio-tracks
	输出设备	$audio-devices
	静音 (m)	cycle mute	checked=mute
	----------------------------------------
	音量 +5%	add volume 5
	音量 -5%	add volume -5
	----------------------------------------
	夜间防打扰	af toggle loudnorm=I=-16:TP=-1.5:LRA=11
	对白增强	af toggle dynaudnorm=g=5:f=250:r=0.9:p=0.5
	----------------------------------------
	音频提前 0.1s	add audio-delay -0.1
	音频延后 0.1s	add audio-delay 0.1
	延迟归零	set audio-delay 0

倍速
	0.75x	set speed 0.75	checked=speed == 0.75
	1.00x	set speed 1.00	checked=speed == 1
	1.25x	set speed 1.25	checked=speed == 1.25
	1.50x	set speed 1.50	checked=speed == 1.5
	2.00x	set speed 2.00	checked=speed == 2
	----------------------------------------
	恢复原速	set speed 1.0

画质与色彩
	去色带 (Deband)	cycle deband	checked=deband
	去隔行	cycle deinterlace	checked=deinterlace_active
	SDR转HDR	cycle inverse-tone-mapping
	----------------------------------------
	HDR: 样条插值 (Spline)	set tone-mapping spline
	HDR: BT.2446a	set tone-mapping bt.2446a
	HDR: 自动	set tone-mapping auto
	----------------------------------------
	画面旋转与比例
		旋转 90 度	cycle-values video-rotate 90 180 270 0
		水平翻转	vf toggle hflip
		----------------------------------------
		默认比例	set video-aspect-override no
		16:9	set video-aspect-override 16:9
		2.35:1	set video-aspect-override 2.35:1
	----------------------------------------
	色彩重置	set brightness 0; set contrast 0; set saturation 0; set gamma 0; show-text '画面色彩已重置'
	硬件解码	cycle-values hwdec auto-safe no

播放列表
	播放列表	$playlist
	章节列表	$chapters
	----------------------------------------
	上一个	playlist-prev
	下一个	playlist-next
	随机播放	playlist-shuffle

工具
	全屏 (Enter)	cycle fullscreen	checked=fullscreen
	置顶	cycle ontop	checked=ontop
	----------------------------------------
	截图 (带字幕)	async screenshot
	原画 (无字幕)	async screenshot video
	----------------------------------------
	复制路径	set clipboard/text ${path}; show-text '已复制文件路径'
	播剪贴板	loadfile "" replace
	性能面板 (Tab)	script-binding stats/display-stats-toggle

剪辑与压制
	标记切片 (c)	script-message slicing-mark
	清除标记 (C)	script-message slicing-clear
	保留音频	script-message slicing-audio-toggle
	----------------------------------------
	GPU压制 (Ctrl+b)	script-message burn-current-sub
	提取音频 (Ctrl+e)	script-message extract-audio

----------------------------------------

退出	quit
退出并保存进度	quit-watch-later
